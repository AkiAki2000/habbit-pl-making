name: 株価取得（朝・夕方）

on:
  schedule:
    # UTC 22:00 Sun-Thu = JST 07:00 Mon-Fri (平日朝7時、前営業日の終値を反映)
    - cron: "0 22 * * 0-4"
    # UTC 07:30 Mon-Fri = JST 16:30 Mon-Fri (平日夕方4時半、取引終了後に当日の終値を反映)
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch prices
        run: python scripts/fetch_prices.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/companies.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: daily price update $(date -u +%Y-%m-%d)"
          git push
